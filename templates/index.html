<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGT - Croquis de Asientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .asiento {
            width: 50px;
            height: 50px;
            margin: 5px;
            font-weight: bold;
        }
        .asiento.ocupado {
            background-color: #dc3545 !important;
            color: white;
            cursor: not-allowed;
        }
        .asiento.seleccionado {
            background-color: #198754 !important;
            color: white;
        }
        .pasillo {
            width: 30px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <h2 class="text-center mb-4">Sistema de Gestión de Transporte</h2>
        
        <div class="row">
            <!-- Croquis del Vehículo -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm p-4">
                    <h4 class="card-title text-center mb-3">Croquis del Vehículo</h4>
                    <p class="text-muted text-center small">Haz clic en un asiento disponible para elegirlo</p>

                    <div class="d-flex flex-column align-items-center bg-white p-3 border rounded">
                        <!-- Conductor / Frente -->
                        <div class="w-100 text-end mb-3 pe-3">
                            <span class="badge bg-secondary p-2">🚍 Conductor</span>
                        </div>

                        <!-- Filas de Asientos -->
                        <div class="d-flex mb-2">
                            <button class="btn btn-outline-primary asiento" onclick="seleccionarAsiento('A1', this)">A1</button>
                            <button class="btn btn-outline-primary asiento" onclick="seleccionarAsiento('A2', this)">A2</button>
                            <div class="pasillo"></div>
                            <button class="btn btn-outline-primary asiento" onclick="seleccionarAsiento('A3', this)">A3</button>
                            <button class="btn btn-outline-primary asiento" onclick="seleccionarAsiento('A4', this)">A4</button>
                        </div>

                        <div class="d-flex mb-2">
                            <button class="btn btn-outline-primary asiento" onclick="seleccionarAsiento('B1', this)">B1</button>
                            <button class="btn btn-outline-primary asiento" onclick="seleccionarAsiento('B2', this)">B2</button>
                            <div class="pasillo"></div>
                            <button class="btn btn-outline-primary asiento" onclick="seleccionarAsiento('B3', this)">B3</button>
                            <button class="btn btn-outline-primary asiento" onclick="seleccionarAsiento('B4', this)">B4</button>
                        </div>

                        <div class="d-flex mb-2">
                            <button class="btn btn-outline-primary asiento" onclick="seleccionarAsiento('C1', this)">C1</button>
                            <button class="btn btn-outline-primary asiento" onclick="seleccionarAsiento('C2', this)">C2</button>
                            <div class="pasillo"></div>
                            <button class="btn btn-outline-primary asiento" onclick="seleccionarAsiento('C3', this)">C3</button>
                            <button class="btn btn-outline-primary asiento" onclick="seleccionarAsiento('C4', this)">C4</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulario de Reserva -->
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h4 class="card-title mb-3">Formulario de Reserva</h4>
                    <form action="/reservar" method="POST">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Pasajero</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
                        </div>

                        <div class="mb-3">
                            <label for="asientoInput" class="form-label">Asiento Seleccionado</label>
                            <input type="text" class="form-control fw-bold text-success" id="asientoInput" name="asiento" readonly required placeholder="Selecciona un asiento en el croquis">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Confirmar Reserva</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function seleccionarAsiento(codigo, elemento) {
            // Quitar clase 'seleccionado' de otros botones
            document.querySelectorAll('.asiento').forEach(btn => {
                btn.classList.remove('seleccionado');
            });

            // Seleccionar el botón actual
            elemento.classList.add('seleccionado');

            // Asignar al input del formulario
            document.getElementById('asientoInput').value = codigo;
        }
    </script>
</body>
</html>
